# codex-chat local configuration example.
# Copy to config/codex-chat.toml and adjust for this machine.
# Secrets are read from environment variables, not from this TOML file.
version = 1

[service]
name = "codex-chat"
workspace = "."
stateDir = "data/state"
logLevel = "info"
timezone = "Etc/UTC"
ipcSocket = "data/run/codex-chat.sock"

[codex]
binary = "codex"
transport = "app-server"
appServerHost = "127.0.0.1"
appServerPort = 49345
model = "gpt-5.5"
effort = "medium"
# Main-loop Codex service tier. Current default is Fast; set "standard" here or via CODEX_CHAT_CODEX_SERVICE_TIER to opt back to standard/slow mode.
serviceTier = "fast"
# auto = omit serviceTier for non-openai modelProvider; always = force; omit = never send.
serviceTierMode = "auto"
# Codex CLI profile from user-level $CODEX_HOME/<name>.config.toml. Do not put provider auth in repo config.
profile = ""
# Optional app-server thread/start modelProvider override. Usually empty unless a Codex profile requires explicit provider selection.
modelProvider = ""
# Provider API key env names allowed through only to Codex child processes. Values stay in local env files, never TOML.
providerApiKeyEnvNames = ["OPENROUTER_API_KEY"]
sandbox = "danger-full-access"
approvalPolicy = "never"
mainSessionName = "codex-chat-main"
startupTimeoutSec = 60
turnTimeoutSec = 3600
keepAliveSec = 60
extraConfig = [
  "model_reasoning_effort=\"medium\""
]
addDirs = []

[telegram]
mode = "polling"
botTokenEnv = "TELEGRAM_BOT_TOKEN"
parseMode = "plain"
pairingEnabledOnEmptyAllowlist = true
downloadMaxBytes = 52428800
sendProgressUpdates = true
opsChatId = 0

[telegram.allowlist]
userIds = []
chatIds = []
adminUserIds = []

[slack]
# Slack foundation adapter. Secrets are read from env vars below; do not put
# Slack token or signing-secret values in TOML.
enabled = false
eventsPath = "/api/slack/events"
# Public origin used when rendering Slack Events API URLs.
publicBaseUrl = "https://brain.decisive-outcomes.com"
signingSecretEnv = "SLACK_SIGNING_SECRET"
botTokenEnv = "SLACK_BOT_TOKEN"
appTokenEnv = "SLACK_APP_TOKEN"

[api]
# HTTP API for server-to-server integrations such as audio ingestion and Slack
# Events API. This also auto-enables when CODEXCHAT_INGEST_API_KEYS is set or
# slack.enabled=true. Brain owns the Clerk-protected admin/control-plane surface;
# codex-chat does not serve /admin, /admin/codex-chat, or
# /api/admin/codex-chat/* routes.
enabled = false
host = "127.0.0.1"
port = 49346
# Set true only when binding behind trusted private networking / reverse proxy.
allowNonLocalhost = false

[behavior]
dir = "behavior"
entrypoint = "AGENTS.md"
reloadOnSighup = true

[subagents]
enabled = true
# Production-safe default. Use Telegram command `agent backend app-server` or
# set this to "codex_app_server" only after testing; recover with
# `agent backend exec`.
backend = "codex_exec"
maxConcurrent = 5
defaultModel = ""
defaultEffort = "medium"
# Subagents default to Fast mode; set "standard" only for an explicit standard/slow-mode override. Behavior prompts should still include serviceTier per dispatch.
defaultServiceTier = "fast"
# Optional defaults for Codex CLI profile/provider used by child subagent processes.
defaultCodexProfile = ""
defaultModelProvider = ""
serviceTierMode = "auto"
# Per-dispatch codexProfile/modelProvider overrides are rejected unless enabled and allowlisted.
allowProviderOverride = false
allowedCodexProfiles = []
allowedModelProviders = []
defaultTimeoutSec = 1800
maxTimeoutSec = 7200
maxPromptBytes = 262144
artifactDir = "data/subagents"
childSocketDir = "data/run/subagents"
childStartupTimeoutSec = 60
childInterruptGraceMs = 5000
allowedProfiles = []
cleanupArtifacts = true

[employees]
# Durable Employees are disabled by default. When enabled, the service can start
# minimal non-ephemeral app-server threads and persist per-Employee thread IDs.
# External account integrations, rich tools, autonomous scheduling, mutations,
# and compaction are intentionally not implemented here.
enabled = false
rootDir = "data/employees"
socketDir = "data/run/employees"
defaultModel = "gpt-5.5"
defaultEffort = "medium"
maxActive = 2

[employees.email-calendar]
enabled = false
name = "Email/calendar"
description = "Triage email/calendar context and draft recommendations without mutating external accounts."
# May be absolute; relative paths resolve from the codex-chat repo root.
directory = "data/employees/email-calendar"
profile = "email-calendar"
codexProfile = ""
modelProvider = ""
# Leave serviceTierMode unset for defaults; set "omit" for non-OpenAI provider profiles.
# serviceTierMode = "omit"
model = "gpt-5.5"
effort = "high"
startup = "on_demand"
warmupPrompt = ""
warmupFile = ""
gitRemote = ""
gitBranch = "main"
persistRawLogs = false
compactAfterTask = true

[employees.email-calendar.memory]
enabled = true
persistRawLogs = false
notes = "Summaries and source pointers first; raw email/calendar bodies only by explicit future policy."

[employees.email-calendar.compaction]
compactAfterTask = true
interval = "manual"
notes = "Placeholder only; no compaction worker runs in scaffold mode."

[employees.email-calendar.capabilities]
# Add "subagents" (or specific request_subagent/cancel_subagent/steer_subagent)
# when this Employee is allowed to request centrally-managed child subagents.
allowed = []
denied = ["external_account_calls", "calendar_mutations", "crm_mutations", "todo_mutations"]
notes = "Placeholder ACL/capability model for future pilots."

[employees.email-calendar.acl]
telegramUserIds = []
adminUserIds = []
notes = "Placeholder ACL; no external account mutations are implemented by the minimal runtime."

[loops]
enabled = true
path = "config/loops.json"
namespace = "codex-chat"
runnerCommand = "codex-chat loop run"

[monitors]
enabled = true
path = "config/monitors.json"
maxRestartBackoffSec = 300

[files]
dir = "data/files"
artifactDir = "data/artifacts"
allowedSendRoots = [
  "data",
  "."
]

[transcription]
enabled = true
provider = "openai"
# Regular Telegram voice/audio transcription model.
model = "gpt-4o-transcribe"
# Speaker diarization model used when a caller/request explicitly selects
# transcription_mode="diarize" or a Telegram audio context asks to diarize.
diarizeModel = "gpt-4o-transcribe-diarize"
apiKeyEnv = "OPENAI_API_KEY"
language = ""
promptPath = ""

[ingest]
# Ingestion API keys are secret and read only from this env var. Format:
# CODEXCHAT_INGEST_API_KEYS="iphone:secret-one,soundcore:secret-two"
apiKeysEnv = "CODEXCHAT_INGEST_API_KEYS"
audioMaxMb = 100

[security]
redactSecretsInLogs = true
requireLocalFileForSend = true
allowShellActionsFromDirectives = false
