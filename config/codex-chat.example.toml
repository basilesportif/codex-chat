# codex-chat local configuration example.
# Copy to config/codex-chat.toml and adjust for this machine.
# Secrets are read from environment variables, not from this TOML file.
version = 1

[service]
name = "codex-chat"
workspace = "."
stateDir = "data/state"
logLevel = "info"
timezone = "Etc/UTC"
ipcSocket = "data/run/codex-chat.sock"

[codex]
binary = "codex"
transport = "app-server"
appServerHost = "127.0.0.1"
appServerPort = 49345
model = "gpt-5.5"
effort = "medium"
profile = ""
sandbox = "danger-full-access"
approvalPolicy = "never"
mainSessionName = "codex-chat-main"
startupTimeoutSec = 60
turnTimeoutSec = 3600
keepAliveSec = 60
extraConfig = [
  "model_reasoning_effort=\"medium\""
]
addDirs = []

[telegram]
mode = "polling"
botTokenEnv = "TELEGRAM_BOT_TOKEN"
parseMode = "plain"
pairingEnabledOnEmptyAllowlist = true
downloadMaxBytes = 52428800
sendProgressUpdates = true
opsChatId = 0

[telegram.allowlist]
userIds = []
chatIds = []
adminUserIds = []

[behavior]
dir = "behavior"
entrypoint = "AGENTS.md"
reloadOnSighup = true

[subagents]
enabled = true
# Production-safe default. Use Telegram command `agent backend app-server` or
# set this to "codex_app_server" only after testing; recover with
# `agent backend exec`.
backend = "codex_exec"
maxConcurrent = 5
defaultModel = ""
defaultEffort = "medium"
defaultTimeoutSec = 1800
maxTimeoutSec = 7200
maxPromptBytes = 262144
artifactDir = "data/subagents"
childSocketDir = "data/run/subagents"
childStartupTimeoutSec = 60
childInterruptGraceMs = 5000
allowedProfiles = []
cleanupArtifacts = true

[loops]
enabled = true
path = "config/loops.json"
namespace = "codex-chat"
runnerCommand = "codex-chat loop run"

[monitors]
enabled = true
path = "config/monitors.json"
maxRestartBackoffSec = 300

[files]
dir = "data/files"
artifactDir = "data/artifacts"
allowedSendRoots = [
  "data",
  "."
]

[transcription]
enabled = true
provider = "openai"
model = "gpt-4o-mini-transcribe"
apiKeyEnv = "OPENAI_API_KEY"
language = ""
promptPath = ""

[security]
redactSecretsInLogs = true
requireLocalFileForSend = true
allowShellActionsFromDirectives = false
