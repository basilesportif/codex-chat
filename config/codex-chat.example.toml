# codex-chat local configuration example.
# Copy to config/codex-chat.toml and adjust for this machine.
# Secrets are read from environment variables, not from this TOML file.
version = 1

[service]
name = "codex-chat"
workspace = "."
stateDir = "data/state"
logLevel = "info"
timezone = "America/New_York"
ipcSocket = "data/run/codex-chat.sock"

[mainAgent]
# Selects the main-loop provider. claude_agent_sdk requires Claude subscription
# OAuth. The [codex] section remains the Codex adapter's settings.
provider = "codex"

[mainAgent.claude]
# Alias or full Claude model ID. Requires Claude subscription OAuth: run
# `claude auth login` as the service user. Change [mainAgent].provider to
# "claude_agent_sdk" and restart to enable. Roll back by setting it to "codex"
# and restarting; the provider-scoped Codex session remains available.
model = "claude-sonnet-5"
effort = "high"
permissionMode = "bypassPermissions"
allowDangerouslySkipPermissions = true
allowedTools = ["Read", "Write", "Edit", "MultiEdit", "Bash", "Glob", "Grep", "Agent"]
disallowedTools = []
# Empty prevents user/project settings from adding non-OAuth auth sources.
settingSources = []
pathToClaudeCodeExecutable = ""
mainSessionName = "codex-chat-main-claude"
startupTimeoutSec = 90

[codex]
binary = "codex"
transport = "app-server"
appServerHost = "127.0.0.1"
appServerPort = 49345
model = "gpt-5.6-luna"
effort = "xhigh"
# Main-loop Codex service tier. Current default is Fast; set "standard" here or via CODEX_CHAT_CODEX_SERVICE_TIER to opt back to standard/slow mode.
serviceTier = "fast"
# auto = omit serviceTier for non-openai modelProvider; always = force; omit = never send.
serviceTierMode = "auto"
# Codex CLI profile from user-level $CODEX_HOME/<name>.config.toml. Do not put provider auth in repo config.
profile = ""
# Optional app-server thread/start modelProvider override. Usually empty unless a Codex profile requires explicit provider selection.
modelProvider = ""
# Provider API key env names allowed through only to Codex child processes. Values stay in local env files, never TOML.
providerApiKeyEnvNames = ["OPENROUTER_API_KEY"]
sandbox = "danger-full-access"
approvalPolicy = "never"
mainSessionName = "codex-chat-main"
startupTimeoutSec = 60
turnTimeoutSec = 3600
keepAliveSec = 60
extraConfig = [
  "model_reasoning_effort=\"xhigh\""
]
addDirs = []

[telegram]
mode = "polling"
botTokenEnv = "TELEGRAM_BOT_TOKEN"
parseMode = "plain"
pairingEnabledOnEmptyAllowlist = true
downloadMaxBytes = 52428800
sendProgressUpdates = true
opsChatId = 0

[telegram.allowlist]
userIds = []
chatIds = []
adminUserIds = []

[slack]
# Slack foundation adapter. Secrets are read from env vars below; do not put
# Slack token or signing-secret values in TOML.
enabled = false
eventsPath = "/api/slack/events"
# Public origin used when rendering Slack Events API URLs.
publicBaseUrl = "https://brain.decisive-outcomes.com"
signingSecretEnv = "SLACK_SIGNING_SECRET"
botTokenEnv = "SLACK_BOT_TOKEN"
appTokenEnv = "SLACK_APP_TOKEN"

[slack.context]
# Full Slack channel/thread context routing is enabled from the first runtime
# implementation. Root channel app_mentions reply in a Slack thread attached to
# the invoking message while hydrating a small recent channel window; existing
# thread mentions hydrate/reply in that thread. If Slack history scopes or rate
# budget are unavailable, the runtime falls back to the source message and tells
# the model not to claim broader context.
enabled = true
maxChannelMessages = 15
maxThreadMessages = 30
maxMessageChars = 700
maxTotalChars = 6000
fetchTimeoutMs = 2500

[api]
# HTTP API for server-to-server integrations such as audio ingestion and Slack
# Events API. This also auto-enables when CODEXCHAT_INGEST_API_KEYS is set or
# slack.enabled=true. Brain owns the Clerk-protected admin/control-plane surface;
# codex-chat does not serve /admin, /admin/codex-chat, or
# /api/admin/codex-chat/* routes.
enabled = false
host = "127.0.0.1"
port = 49346
# Set true only when binding behind trusted private networking / reverse proxy.
allowNonLocalhost = false

[behavior]
dir = "behavior"
entrypoint = "AGENTS.md"
reloadOnSighup = true

[subagents]
enabled = true
# Production-safe DEFAULT backend for new subagent jobs. A dispatch_subagent
# directive may override it per job with `backend` ("codex_exec",
# "codex_app_server", "claude_agent_sdk"; aliases "exec", "app-server",
# "claude"). Use Telegram command `agent backend app-server` or set this to
# "codex_app_server" only after testing; recover with `agent backend exec`.
backend = "codex_exec"
maxConcurrent = 5
defaultModel = "gpt-5.6-luna"
defaultEffort = "xhigh"
# Subagents default to Fast mode; set "standard" only for an explicit standard/slow-mode override. Behavior prompts should still include serviceTier per dispatch.
defaultServiceTier = "fast"
# Optional defaults for Codex CLI profile/provider used by child subagent processes.
defaultCodexProfile = ""
defaultModelProvider = ""
serviceTierMode = "auto"
# Per-dispatch codexProfile/modelProvider overrides are rejected unless enabled and allowlisted.
allowProviderOverride = false
allowedCodexProfiles = []
allowedModelProviders = []
defaultTimeoutSec = 1800
maxTimeoutSec = 7200
maxPromptBytes = 262144
artifactDir = "data/subagents"
childSocketDir = "data/run/subagents"
childStartupTimeoutSec = 60
childInterruptGraceMs = 5000
allowedProfiles = []
# At startup, jobs interrupted by a crash or restart that never reported back
# get one Telegram notice to their originating chat (batched per chat, sent
# once — the notified state is persisted on the job record). This bounds how
# far back that scan looks; older records are already terminal and a notice
# about them would be archaeology.
# Env override: CODEX_CHAT_SUBAGENTS_ORPHAN_NOTICE_MAX_AGE_HOURS
orphanNoticeMaxAgeHours = 24
cleanupArtifacts = true

[subagents.claude]
# Disabled by default. Opt in only after configuring Claude subscription OAuth
# with `claude auth login` (local ~/.claude credentials) or
# `claude setup-token` / CLAUDE_CODE_OAUTH_TOKEN. API keys and provider
# auth env vars are stripped/rejected for this backend.
#
# Model strings are passed through unchanged to the Claude Agent SDK. Prefer
# pinned Claude IDs for reproducible subagent launches:
#   claude-opus-5     # Opus 5 (flagship since 2026-07-24); Claude Code alias `opus`
#   claude-opus-4-8   # Opus 4.8
#   claude-fable-5-1  # Fable 5.1 (current Fable since 2026-09-01); Claude Code alias `fable`
#   claude-fable-5    # Fable 5 (pinned older snapshot)
#   claude-sonnet-5   # Sonnet 5; Claude Code alias `sonnet`
#   claude-haiku-4-5-20251001  # alias `claude-haiku-4-5`
# Claude Code aliases (`best`, `opus`, `fable`, `sonnet`, `haiku`, etc.) are
# accepted by Claude Code/SDK but can change over time; use full IDs in docs,
# tests, and canaries. Avoid effort `none`/`minimal` with Fable 5.1 because it
# has always-on adaptive thinking.
enabled = false
pathToClaudeCodeExecutable = ""
# Implementer model alias or full ID; 'sonnet'/'haiku'/'opus'/'fable' resolve to the current family.
implementerModel = "sonnet"
# Investigator model alias or full ID; 'sonnet'/'haiku'/'opus'/'fable' resolve to the current family.
investigatorModel = "sonnet"
# Reviewer model alias or full ID; 'sonnet'/'haiku'/'opus'/'fable' resolve to the current family.
reviewerModel = "claude-opus-5"
permissionMode = "bypassPermissions"
allowDangerouslySkipPermissions = true
# codex-chat also injects the Claude SDK native "Agent" tool for all
# Claude-backed jobs so they can launch service-owned programmatic SDK agents.
# The built-in implementer, investigator, and reviewer models are configured
# above; each definition has a role-specific effort and tool set.
allowedTools = ["Read", "Write", "Edit", "MultiEdit", "Bash", "Glob", "Grep"]
disallowedTools = []
maxTurns = 100
# Empty isolates subagents from user/project/local Claude settings that could
# contain apiKeyHelper or non-OAuth provider configuration.
settingSources = []
# Claude has no Codex serviceTier equivalent. When a subagent requests Fast,
# codex-chat applies Claude Code fastMode settings when supported and records
# that serviceTier itself is otherwise ignored.
fastMode = true
# Hard ceiling on nested agents running CONCURRENTLY inside one Claude session.
# Applies at both depths (a child job AND the Claude main loop) because it is a
# whole-host memory guard: each nested agent is its own `claude` process. On
# 2026-08-18 a job fanned out to three parallel investigators which, with the
# main loop and an operator subagent, OOM-killed the service on a 3.8GB host.
# Calls past the cap are DENIED with an instructive message (wait or work
# sequentially); 0 disables the cap.
# Env override: CODEX_CHAT_SUBAGENTS_CLAUDE_MAX_CONCURRENT_NESTED_AGENTS
maxConcurrentNestedAgents = 2

[employees]
# Durable Employees are disabled by default. When enabled, the service can start
# minimal non-ephemeral app-server threads and persist per-Employee thread IDs.
# External account integrations, rich tools, autonomous scheduling, mutations,
# and compaction are intentionally not implemented here.
enabled = false
rootDir = "data/employees"
socketDir = "data/run/employees"
defaultModel = "gpt-5.6-terra"
defaultEffort = "medium"
maxActive = 2

[employees.email-calendar]
enabled = false
name = "Email/calendar"
description = "Triage email/calendar context and draft recommendations without mutating external accounts."
# May be absolute; relative paths resolve from the codex-chat repo root.
directory = "data/employees/email-calendar"
profile = "email-calendar"
codexProfile = ""
modelProvider = ""
# Leave serviceTierMode unset for defaults; set "omit" for non-OpenAI provider profiles.
# serviceTierMode = "omit"
model = "gpt-5.6-terra"
effort = "medium"
startup = "on_demand"
warmupPrompt = ""
warmupFile = ""
gitRemote = ""
gitBranch = "main"
persistRawLogs = false
compactAfterTask = true

[employees.email-calendar.memory]
enabled = true
persistRawLogs = false
notes = "Summaries and source pointers first; raw email/calendar bodies only by explicit future policy."

[employees.email-calendar.compaction]
compactAfterTask = true
interval = "manual"
notes = "Placeholder only; no compaction worker runs in scaffold mode."

[employees.email-calendar.capabilities]
# Add "subagents" (or specific request_subagent/cancel_subagent/steer_subagent)
# when this Employee is allowed to request centrally-managed child subagents.
allowed = []
denied = ["external_account_calls", "calendar_mutations", "crm_mutations", "todo_mutations"]
notes = "Placeholder ACL/capability model for future pilots."

[employees.email-calendar.acl]
telegramUserIds = []
adminUserIds = []
notes = "Placeholder ACL; no external account mutations are implemented by the minimal runtime."

[loops]
enabled = true
path = "config/loops.json"
namespace = "codex-chat"
runnerCommand = "codex-chat loop run"

[monitors]
enabled = true
path = "config/monitors.json"
maxRestartBackoffSec = 300

[files]
dir = "data/files"
artifactDir = "data/artifacts"
allowedSendRoots = [
  "data",
  "."
]

[transcription]
enabled = true
# Feature-flagged provider switch. `codex_app_server` uses Codex localAudio and
# ChatGPT login for regular transcription; set `openai` for immediate rollback.
# Diarization always remains on the OpenAI provider below.
provider = "openai"
# Regular Telegram voice/audio transcription model.
model = "gpt-4o-transcribe"
# Speaker diarization model used when a caller/request explicitly selects
# transcription_mode="diarize" or a Telegram audio context asks to diarize.
diarizeModel = "gpt-4o-transcribe-diarize"
apiKeyEnv = "OPENAI_API_KEY"
language = ""
promptPath = ""
# Empty inherits [codex].model. localAudio requires Codex CLI/app-server >=0.145.0.
appServerModel = ""
appServerEffort = "medium"
appServerTimeoutSec = 180

[ingest]
# Ingestion API keys are secret and read only from this env var. Format:
# CODEXCHAT_INGEST_API_KEYS="iphone:secret-one,soundcore:secret-two"
apiKeysEnv = "CODEXCHAT_INGEST_API_KEYS"
audioMaxMb = 100

[security]
redactSecretsInLogs = true
requireLocalFileForSend = true
allowShellActionsFromDirectives = false
