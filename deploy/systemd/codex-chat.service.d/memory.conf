# codex-chat memory guard — drop-in for ~/.config/systemd/user/codex-chat.service
#
# Why (2026-08-18 incident): a subagent job spawned three parallel nested
# investigator agents, each its own `claude` process holding multi-MB scraped
# payloads. With the main loop and an operator subagent that was five `claude`
# processes on a 3.8GB host; the kernel OOM-killed the unit mid-job.
#
# Numbers:
#   steady-state service RSS ~940MB
#   incident peak            >3GB (host has 3.8GB RAM + a 4GB swapfile added
#                            2026-08-19)
#   MemoryHigh=2500M         throttles the cgroup and pushes cold pages into
#                            swap well above steady state but well below the
#                            point where the kernel's global OOM killer wakes
#                            up. It is a soft limit: allocation slows, nothing
#                            dies.
#
# There is deliberately NO MemoryMax. A hard ceiling would turn "the kernel
# killed the unit" into "systemd killed the unit" — same outage, new label.
# The structural fix for fan-out is the nested-agent concurrency cap in
# [subagents.claude].maxConcurrentNestedAgents; this drop-in is the backstop.
#
# Install (run on the server; NOT applied automatically):
#   mkdir -p ~/.config/systemd/user/codex-chat.service.d
#   cp deploy/systemd/codex-chat.service.d/memory.conf \
#      ~/.config/systemd/user/codex-chat.service.d/memory.conf
#   systemctl --user daemon-reload
#   systemctl --user restart codex-chat.service
#
# Verify:
#   systemctl --user show codex-chat.service -p MemoryHigh -p MemoryAccounting
#   systemctl --user status codex-chat.service   # shows "Memory: ... (high: 2.4G)"

[Service]
MemoryAccounting=yes
MemoryHigh=2500M
